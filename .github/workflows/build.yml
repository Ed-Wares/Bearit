name: Reusable Maven Compilation Workflow

on:
  workflow_call:
    inputs:
      git_ref:
        description: 'The specific git branch, tag, or SHA hash reference to compile'
        required: true
        type: string
      version_string:
        description: 'The customized version token to embed into the artifact signature'
        required: true
        type: string
      app_version:
        description: 'Strictly numeric version for native OS installers (e.g., 1.0.0)'
        required: true
        type: string        

permissions:
  contents: read

jobs:
  compile_project:
    name: Execute Native Compilation & Packaging
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel, macos-14] # Spin up virtual machines for all three platform targets simultaneously


    steps:
      # Pull the codebase into the virtual machine environment
      - name: Fetch Codebase Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      # Provision JDK 21 Environment
      - name: Provision Amazon Corretto JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      # Inject the dynamic Version String into the Maven project properties
      - name: Apply Dynamic Compilation Version
        run: |
          mvn versions:set -DnewVersion=${{ inputs.app_version }} -DgenerateBackupPoms=false
        shell: bash

      # Build and Package the application into a clean executable JAR file
      - name: Compile Code and Package Executable Artifact
        run: mvn clean package -DskipTests

      # Native Bundle Generation using JDK jpackage
      # --- WINDOWS EXE GENERATION ---
      - name: Build Windows Native Executable (EXE)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type exe \
            --input target/ \
            --main-jar bearit-${{ inputs.app_version }}.jar \
            --main-class com.edwares.BearitApp \
            --name bearit \
            --app-version ${{ inputs.app_version }} \
            --dest distribution_payload/windows/ \
            --icon src/main/resources/Bearit.ico \
            --vendor "EdWares" \
            --win-menu-group "EdWares" \
            --win-per-user-install \
            --win-dir-chooser \
            --win-menu \
            --win-shortcut
        shell: bash

      # This Mac step will now run twice (once for Intel, once for Silicon)
      - name: Build macOS Native Executable (DMG)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p macos_resources
          cat << 'EOF' > macos_resources/Info.plist
          <?xml version="1.0" ?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
           <dict>
            <key>LSMinimumSystemVersion</key>
            <string>10.11</string>
            <key>CFBundleDevelopmentRegion</key>
            <string>English</string>
            <key>CFBundleAllowMixedLocalizations</key>
            <true/>
            <key>CFBundleExecutable</key>
            <string>DEPLOY_LAUNCHER_NAME</string>
            <key>CFBundleIconFile</key>
            <string>DEPLOY_ICON_FILE</string>
            <key>CFBundleIdentifier</key>
            <string>DEPLOY_BUNDLE_IDENTIFIER</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>DEPLOY_BUNDLE_NAME</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>DEPLOY_BUNDLE_SHORT_VERSION</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>LSApplicationCategoryType</key>
            <string>DEPLOY_APP_CATEGORY</string>
            <key>CFBundleVersion</key>
            <string>DEPLOY_BUNDLE_CFBUNDLE_VERSION</string>
            <key>NSHumanReadableCopyright</key>
            <string>DEPLOY_BUNDLE_COPYRIGHT</string>
            <key>CFBundleDocumentTypes</key>
            <array>
             <dict>
              <key>CFBundleTypeName</key>
              <string>Text Document</string>
              <key>CFBundleTypeRole</key>
              <string>Editor</string>
              <key>LSHandlerRank</key>
              <string>Default</string>
              <key>CFBundleTypeIconFile</key>
              <string>DEPLOY_ICON_FILE</string>
              <key>LSItemContentTypes</key>
              <array>
               <string>public.plain-text</string>
               <string>public.utf8-plain-text</string>
               <string>public.text</string>
               <string>public.source-code</string>
               <string>public.script</string>
               <string>public.shell-script</string>
               <string>public.xml</string>
               <string>public.json</string>
               <string>public.yaml</string>
               <string>public.comma-separated-values-text</string>
               <string>public.log</string>
               <string>com.apple.log</string>
               <string>com.apple.property-list</string>
              </array>
             </dict>
             <dict>
              <key>CFBundleTypeName</key>
              <string>All Files</string>
              <key>CFBundleTypeRole</key>
              <string>Editor</string>
              <key>LSHandlerRank</key>
              <string>Alternate</string>
              <key>CFBundleTypeIconFile</key>
              <string>DEPLOY_ICON_FILE</string>
              <key>LSItemContentTypes</key>
              <array>
               <string>public.data</string>
               <string>public.content</string>
               <string>public.item</string>
              </array>
             </dict>
            </array>
            <key>NSHighResolutionCapable</key>
            <string>true</string>
            <key>NSMicrophoneUsageDescription</key>
            <string>The application DEPLOY_LAUNCHER_NAME is requesting access to the microphone.</string>
           </dict>
          </plist>
          EOF

          jpackage --type dmg \
            --input target/ \
            --main-jar bearit-${{ inputs.app_version }}.jar \
            --main-class com.edwares.BearitApp \
            --name bearit \
            --app-version ${{ inputs.app_version }} \
            --dest distribution_payload/macos/ \
            --icon src/main/resources/Bearit.icns \
            --vendor "EdWares" \
            --resource-dir macos_resources/
        shell: bash

      # --- LINUX DEB GENERATION ---
      - name: Build Linux Native Executable (DEB)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p linux_resources
          
          # Post-Install Script
          cat << 'EOF' > linux_resources/postinst
          #!/bin/sh
          # Create the terminal alias
          ln -sf /opt/bearit/bin/bearit /usr/local/bin/bearit
          
          # Manually register the application with the GNOME App Drawer
          # (jpackage usually names the internal file bearit-bearit.desktop)
          if [ -f /opt/bearit/lib/bearit-bearit.desktop ]; then
              cp /opt/bearit/lib/bearit-bearit.desktop /usr/share/applications/bearit.desktop
              update-desktop-database /usr/share/applications/
          fi
          exit 0
          EOF
          chmod +x linux_resources/postinst

          # Pre-Removal Script
          cat << 'EOF' > linux_resources/prerm
          #!/bin/sh
          # Clean up the terminal alias
          rm -f /usr/local/bin/bearit
          
          # Clean up the GNOME App Drawer entry
          rm -f /usr/share/applications/bearit.desktop
          update-desktop-database /usr/share/applications/
          exit 0
          EOF
          chmod +x linux_resources/prerm

          # Run jpackage
          jpackage --type deb \
            --input target/ \
            --main-jar bearit-${{ inputs.app_version }}.jar \
            --main-class com.edwares.BearitApp \
            --name bearit \
            --app-version ${{ inputs.app_version }} \
            --dest distribution_payload/linux/ \
            --icon src/main/resources/Bearit.png \
            --vendor "EdWares" \
            --resource-dir linux_resources/ \
            --linux-menu-group "Utility;Development;"
        shell: bash

      # Normalize cross-platform payload artifacts for extraction
      - name: Normalize Executable File Nomenclature
        run: |
          mkdir -p final_artifacts
          # Always copy the platform agnostic JAR file safely
          cp target/bearit-*.jar final_artifacts/bearit.jar
          
          # Conditionally pull the platform specific installer into the clean root upload directory
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp distribution_payload/windows/*.exe final_artifacts/
          elif [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            cp distribution_payload/macos/*.dmg final_artifacts/bearit-macOS-Intel.dmg
          elif [ "${{ matrix.os }}" = "macos-14" ]; then
            cp distribution_payload/macos/*.dmg final_artifacts/bearit-macOS-AppleSilicon.dmg          
          elif [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            cp distribution_payload/linux/*.deb final_artifacts/            
          fi
        shell: bash

      # Archive the individual platform bundle workspace back to the runner pipeline
      - name: Archive Compiled Binary Workspace
        uses: actions/upload-artifact@v4
        with:
          name: compiled-bearit-package-${{ matrix.os }}-${{ inputs.version_string }}
          path: final_artifacts/*
          retention-days: 7
          if-no-files-found: error